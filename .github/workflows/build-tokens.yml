name: Build Design Tokens

on:
  push:
    branches: [main]
    paths:
      - 'tokens.json'
      - 'scripts/**'
      - 'assets/powerpoint/**'
      - '.github/workflows/build-tokens.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full tag history to detect already-released versions

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate tokens
        run: node scripts/validate.js

      - name: Validate PowerPoint templates
        run: python3 scripts/validate-pptx.py

      - name: Build tokens
        run: node scripts/build.js

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet dist/ && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit generated files
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "chore: regenerate design tokens"
          git push

      # Tagging is gated on meta.version, not on dist/ churn: regenerating output
      # from a build-script tweak must never move an already-published tag, or
      # consumers pinning github:forteadvice/designsystem#vX.Y.Z silently get
      # different content. Bump meta.version in tokens.json to cut a release.
      - name: Tag version
        run: |
          VERSION=$(node -p "require('./tokens.json').meta.version")
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists — nothing to release."
            echo "Bump meta.version in tokens.json to publish a new version."
            exit 0
          fi
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
